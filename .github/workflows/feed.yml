name: feed
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - run: OUT=docs/rss.xml python feed.py
        env:
          OUT: docs/rss.xml
          SELF_URL: ${{ vars.SELF_URL }}
          FEED_UA: ${{ vars.FEED_UA }}
      - run: |
          git config user.name feed-bot
          git config user.email feed-bot@users.noreply.github.com
          git add docs/rss.xml
          git diff --cached --quiet || (git commit -m "refresh feed" && git push)
